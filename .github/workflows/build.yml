name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            dist: dist:mac
          - os: windows-latest
            name: windows
            dist: dist:win
    runs-on: ${{ matrix.os }}
    env:
      # Baked into the app so it can tell when a newer build has been published.
      CHAUDECAL_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Drives the real app window against stand-in services. The stand-ins are
      # scripts, which Windows cannot start directly, so this runs on macOS.
      - name: End-to-end test
        if: matrix.name == 'mac'
        run: npm run e2e

      - name: Package installer
        run: npm run ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: chaudecal-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe

      - uses: actions/upload-artifact@v4
        if: failure() && matrix.name == 'mac'
        with:
          name: e2e-screenshots
          path: e2e/artifacts

  release:
    needs: build
    # Publish whatever was built. GitHub sometimes has no Mac runner free, and
    # that should not hold back the Windows installer (or the other way round).
    # An installer is only uploaded after its job passed the checks and tests.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
          pattern: chaudecal-*
          merge-multiple: true

      - name: See what was built
        id: built
        run: |
          mkdir -p artifacts
          ls -la artifacts
          count=$(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: steps.built.outputs.count != '0'
        with:
          tag_name: v${{ steps.built.outputs.version }}-build.${{ github.run_number }}
          name: Chaudecal AI ${{ steps.built.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automatic build of commit ${{ github.sha }}.

            - Windows: the file ending in `windows-setup.exe`.
            - Mac with Apple silicon: the file ending in `mac-arm64.dmg`.
            - Mac with Intel: the file ending in `mac-x64.dmg`.

            If the file for your system is missing, its build did not finish this time. Use the newest earlier release that has it.

            These builds are not signed with a paid developer certificate, so both systems warn on first launch. See the README for how to open them.
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
